# .github/workflows/test.yml
# 自动化测试流水线：单元 / 集成 / 端到端 三档，含覆盖率门槛与产物归档。
#
# 设计要点：
#  - frontend-unit：Vitest 单测 + v8 覆盖率（门槛见 vitest.config.js）。
#  - rust-unit：cargo test（含 windows/settings/lib 的 #[cfg(test)] 模块）。
#  - e2e：xvfb + tauri-driver + tauri build --debug + Playwright（最重，仅在 push tag 或手动触发时跑）。
#  - 使用 rsproxy 镜像源加速 cargo 依赖拉取（GitHub crates.io 直连常超时）。

name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  rust-unit:
    name: Rust Unit & Integration (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Configure rsproxy mirror
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy-sparse"
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [registries.rsproxy-sparse]
          protocol = "sparse"
          EOF
      - name: Run cargo test (lib + integration)
        working-directory: src-tauri
        run: cargo test --all-features -- --nocapture
      - name: Upload cargo test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-output
          path: src-tauri/target/debug/

  e2e:
    name: E2E (Playwright + tauri-driver)
    # e2e 最重：仅在打 tag 或手动触发时运行，避免每次 PR 都编译原生包
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps + tauri-driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf libssl-dev xvfb
          cargo install tauri-driver --version "^2.0.0" || true
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e under virtual display
        run: xvfb-run -a npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  coverage-gate:
    name: Coverage Gate
    needs: [frontend-unit, rust-unit]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend & Rust unit coverage gates enforced in their respective jobs."
