# .github/workflows/test.yml
# 自动化测试流水线：单测 / Rust / E2E-Web 三档并行。
#
# 设计要点：
#  - frontend-unit：Vitest 单测 + 组件 + 契约测试 + v8 覆盖率（门槛见 vitest.config.js：90/80/85/90）。
#  - rust-unit：src-tauri 与 rust-api 两个 crate 都跑。rust-api 是 src-tauri 的 path 依赖
#    （kugoumusicapi = { path = "../rust-api" }），属于随包分发的代码，必须测。
#  - e2e-web：Playwright 驱动 Vite dev server（约 5s）。
#  - e2e-native：tauri-driver + msedgedriver + 自写 WebDriver 客户端，仅手动触发
#    （需真实 WebView2 与 Windows）。见 docs/TESTING_PLAN.md §0.6。
#  - 使用 rsproxy 镜像源加速 cargo 依赖拉取（GitHub crates.io 直连常超时）。
#
# 不监听 tag 的原因：tag 触发的本意是「发版前把关」，但 GitHub Actions 的 workflow 之间
# 没有隐式依赖，release.yml 会并行开跑，这边的红灯拦不住任何东西，只是白烧 5 个 job 的
# 分钟数。发版门禁已改由 release.yml 的 gate job 承担。

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 已 EOL，与 release 构建统一用 22
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # 与 release 构建一致：按 pnpm-lock.yaml 精确安装，避免 @tauri-apps/* 浮动版本与 Rust crate 不一致
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        # 覆盖率门槛由 vitest.config.js 的 thresholds 承担，未达标即非零退出
        run: npm run test:coverage
      - name: Upload coverage report
        # 覆盖率报告留作 artifact 供人工查看。
        # 原 Codecov 上传步骤已移除：仓库内无 codecov.yml、README 无徽章、且该步骤
        # 配了 continue-on-error + fail_ci_if_error: false，实际是「看起来有覆盖率服务」的
        # 空转（用的 v4 也已落后至 v7）。需要 Codecov 时按官方文档接 v7 并配 token。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/

  rust-unit:
    name: Rust Unit (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            rust-api -> target
      - name: Configure rsproxy mirror
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy-sparse"
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [registries.rsproxy-sparse]
          protocol = "sparse"
          EOF
      - name: Run src-tauri tests
        working-directory: src-tauri
        # pipefail 防止 tee 吞掉 cargo test 的非零退出码
        run: set -o pipefail && cargo test --all-features -- --nocapture | tee ../rust-test-output.log
      - name: Run rust-api tests
        working-directory: rust-api
        # 签名/加密/工具函数的向量对拍，14 例、约 2.5s
        run: set -o pipefail && cargo test --lib -- --nocapture | tee ../rust-api-test-output.log
      - name: Upload cargo test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-output
          path: |
            rust-test-output.log
            rust-api-test-output.log

  e2e-web:
    name: E2E Web (Playwright)
    # 只依赖 Vite（秒级），因此 PR 阶段即可运行；原生窗用例走独立 job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e (web)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  e2e-native:
    name: E2E Native (Windows / WebView2)
    # 需要真实 WebView2 运行时与原生窗口：仅手动触发，避免占用 PR 时长。
    # 覆盖 Web 轨验不到的部分：真实 Tauri 进程、真实 IPC（Web 轨的 IPC 是 mock 的）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install tauri-driver
        run: cargo install tauri-driver --version "^2.0.0"
      - name: Install matching msedgedriver
        shell: pwsh
        # msedgedriver 版本必须与 runner 上的 WebView2 运行时完全一致，否则会话建立失败
        run: |
          $ver = (Get-ChildItem "C:\Program Files (x86)\Microsoft\EdgeWebView\Application" -Directory |
                  Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]$_.Name } -Descending |
                  Select-Object -First 1).Name
          Write-Host "WebView2 version: $ver"
          if (-not $ver) { throw "未找到 WebView2 运行时目录" }
          New-Item -ItemType Directory -Force -Path tests/e2e/native/bin | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath tests/e2e/native/bin -Force
      - name: Build app (debug)
        run: npx tauri build --debug --no-bundle
      - name: Run native e2e
        run: npm run test:e2e:native
