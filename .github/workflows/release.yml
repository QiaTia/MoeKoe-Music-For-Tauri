name: Release

# 推送形如 v* 的 tag（例如 v1.7.1）时自动为 Windows / macOS / Linux 构建并发布到 Releases。
# 也可在 GitHub 网页上手动触发（workflow_dispatch，version 必填）。
#
# 结构：preflight（解析并校验 tag）→ gate（测试门）→ build（矩阵编译发布）
#
# 设计要点：
#  - preflight：手动触发时 version 留空会**直接失败**。旧写法 `inputs.version || github.ref_name`
#    在 ref_name 是分支名时会创建名为分支的 tag，属于隐性事故。
#    同时校验 tag 与 package.json / tauri.conf.json / src-tauri/Cargo.toml 三处版本一致 ——
#    Cargo.toml 的 version 需手工同步，漏改会导致安装包内版本号与 tag 不符。
#  - gate：发布前跑一遍单测/覆盖率/E2E/Rust 测试。旧结构与 test.yml 互不依赖，
#    Test 红灯完全拦不住发布，这是最大的结构性风险。
#  - 每个「平台 × 架构」是独立 matrix job：某架构构建失败不会连带跳过其它架构
#    （旧版把 macOS/Windows 两个架构串在同一 job 的 step 里，前一步失败后一步不执行）。
#  - fail-fast: false：单平台失败不影响其余平台出包。
#  - 所有 job 通过 preflight 解析出的同一 tag 往同一个 Release 追加产物。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（例如 v1.7.1）。必填，留空会直接失败。'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) 解析并校验发布版本
  # ─────────────────────────────────────────────────────────────
  preflight:
    name: Resolve & verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
            if [ -z "$raw" ]; then
              echo "::error::workflow_dispatch 必须填写 version（例如 v1.7.1）。留空会退化为 github.ref_name（分支名），创建错误的 tag。"
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi
          # 手动输入常见前导/尾随空格（如 " v1.7.1"），会拼出 "v v1.7.1" 这种无效 tag
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          case "$raw" in
            v*) tag="$raw" ;;
            *)  tag="v$raw" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布 tag: $tag"

      - name: Verify version consistency
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          # Cargo.toml 的 version 需手工同步，是最容易漏的一处，因此三处一起校验
          pkg=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag        = ${want}"
          echo "package    = ${pkg}"
          echo "tauri.conf = ${conf}"
          echo "Cargo.toml = ${cargo}"
          fail=0
          for pair in "package.json:${pkg}" "src-tauri/tauri.conf.json:${conf}" "src-tauri/Cargo.toml:${cargo}"; do
            name="${pair%%:*}"
            got="${pair#*:}"
            if [ "$got" != "$want" ]; then
              echo "::error file=${name}::版本为 ${got}，但发布 tag 是 ${TAG}（期望 ${want}）。请先统一版本再发版。"
              fail=1
            fi
          done
          exit $fail

  # ─────────────────────────────────────────────────────────────
  # 2) 测试门：不通过则不出包
  # ─────────────────────────────────────────────────────────────
  gate:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile

      - name: Frontend unit + coverage
        run: npm run test:coverage

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E web
        run: npm run test:e2e

      - name: Install system deps (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            rust-api -> target

      - name: Rust tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Rust tests (rust-api)
        working-directory: rust-api
        run: cargo test --lib

  # ─────────────────────────────────────────────────────────────
  # 3) 矩阵构建并发布
  # ─────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.label }}
    needs: [preflight, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Windows x86_64'
            platform: 'windows-latest'
            rust_targets: ''
            args: ''
          - label: 'Windows arm64'
            platform: 'windows-latest'
            rust_targets: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - label: 'macOS x86_64 (Intel)'
            platform: 'macos-latest'
            # macos-latest 为 arm64 runner，Intel 包为交叉编译（Tauri 官方推荐做法）
            rust_targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - label: 'macOS aarch64 (Apple Silicon)'
            platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - label: 'Linux (deb + AppImage)'
            platform: 'ubuntu-22.04'
            rust_targets: ''
            # 跳过 rpm（CI 镜像缺 rpmbuild），保留 deb 与 AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 各 job 只需安装自己的交叉 target（原生 target 由 toolchain 默认提供）
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        # 必须用 pnpm + 锁文件安装：npm install 无 lockfile 会浮动到最新次版本，
        # 导致 @tauri-apps/api 与 Cargo.lock 中的 tauri crate 主次版本不一致，
        # tauri-action 直接报 “Found version mismatched Tauri packages” 中止构建。
        run: pnpm install --frozen-lockfile

      - name: Build and publish (Tauri) - ${{ matrix.label }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ↓↓↓ 可选：在仓库 Settings → Secrets 配置以下变量后，macOS 会自动签名并公证。
          #     不配置则以「未签名」方式构建（功能正常，仅首次打开需右键→打开绕过 Gatekeeper）。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: 'src-tauri'
          # 只用 preflight 解析并校验过的 tag，不回退到 ref_name
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: 'MoeKoe Music ${{ needs.preflight.outputs.tag }}'
          releaseBody: |
            ## MoeKoe Music ${{ needs.preflight.outputs.tag }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
