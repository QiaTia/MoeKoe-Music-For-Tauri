name: Release

# 推送形如 v* 的 tag（例如 v1.7.1）时，自动为 Windows / macOS / Linux 构建并发布到 Releases。
# 也可在 GitHub 网页上手动触发（workflow_dispatch，可指定 tag 名）。
#
# 设计要点：
#  - 每个「平台 × 架构」是独立 matrix job：某架构构建失败不会连带跳过其它架构
#    （旧版把 macOS/Windows 两个架构串在同一 job 的 step 里，前一步失败后一步不执行）。
#  - fail-fast: false：单平台失败不影响其余平台出包。
#  - 所有 job 通过同一 tagName 往同一个 Release 追加产物。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（例如 v1.7.1），留空则使用当前 ref'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Windows x86_64'
            platform: 'windows-latest'
            rust_targets: ''
            args: ''
          - label: 'Windows arm64'
            platform: 'windows-latest'
            rust_targets: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - label: 'macOS x86_64 (Intel)'
            platform: 'macos-latest'
            # macos-latest 为 arm64 runner，Intel 包为交叉编译（Tauri 官方推荐做法）
            rust_targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - label: 'macOS aarch64 (Apple Silicon)'
            platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - label: 'Linux (deb + AppImage)'
            platform: 'ubuntu-22.04'
            rust_targets: ''
            # 跳过 rpm（CI 镜像缺 rpmbuild），保留 deb 与 AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 各 job 只需安装自己的交叉 target（原生 target 由 toolchain 默认提供）
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        # 必须用 pnpm + 锁文件安装：npm install 无 lockfile 会浮动到最新次版本，
        # 导致 @tauri-apps/api 与 Cargo.lock 中的 tauri crate 主次版本不一致，
        # tauri-action 直接报 “Found version mismatched Tauri packages” 中止构建。
        run: pnpm install --frozen-lockfile

      - name: Build and publish (Tauri) - ${{ matrix.label }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ↓↓↓ 可选：在仓库 Settings → Secrets 配置以下变量后，macOS 会自动签名并公证。
          #     不配置则以「未签名」方式构建（功能正常，仅首次打开需右键→打开绕过 Gatekeeper）。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: 'src-tauri'
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'MoeKoe Music ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.event.inputs.version || github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
