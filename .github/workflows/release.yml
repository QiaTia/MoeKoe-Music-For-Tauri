name: Release

# 推送形如 v* 的 tag（例如 v1.6.9）时，自动为 Windows / macOS / Linux 构建并发布到 Releases。
# 也可在 GitHub 网页上手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # Windows 分架构构建：在一个 runner 上顺序产出 x86_64 与 arm64 两个独立 exe
            args: ''
          - platform: 'macos-latest'
            # macOS 分架构构建：在一个 runner 上顺序产出 x86_64 与 aarch64 两个独立 dmg
            args: ''
          - platform: 'ubuntu-22.04'
            # 跳过 rpm（CI 镜像缺 rpmbuild），保留 deb 与 AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 分架构构建需要安装对应的交叉编译 target：
          #  - macOS：x86_64 / aarch64
          #  - Windows：额外安装 arm64（x86_64 为默认 target，无需单独列出）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        # 项目使用 npm（仓库中无 lockfile，action 会自动回退到 npm）
        run: npm install

      - name: Build and publish (Tauri) - Linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'MoeKoe Music ${{ github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '${{ matrix.args }}'

      - name: Build and publish (Tauri) - Windows x86_64
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'MoeKoe Music ${{ github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: ''

      - name: Build and publish (Tauri) - Windows arm64
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'MoeKoe Music ${{ github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-pc-windows-msvc'

      - name: Build and publish (Tauri) - macOS x86_64 (Intel)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ↓↓↓ 可选：在仓库 Settings → Secrets 配置以下变量后，macOS 会自动签名并公证。
          #     不配置则以「未签名」方式构建（功能正常，仅首次打开需右键→打开绕过 Gatekeeper）。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'MoeKoe Music ${{ github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-apple-darwin'

      - name: Build and publish (Tauri) - macOS aarch64 (Apple Silicon)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ↓↓↓ 可选：在仓库 Settings → Secrets 配置以下变量后，macOS 会自动签名并公证。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'MoeKoe Music ${{ github.ref_name }}'
          releaseBody: |
            ## MoeKoe Music ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'
