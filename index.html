<!-- public/index.html -->
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MoeKoe 萌音</title>
    <meta name="theme-color" content="#FF91AF">
    <meta name="description" content="MoeKoe 萌音,一个高颜值的kugou第三方播放器">
    <meta name="author" content="MoeJue">
    <meta name="url" content="https://MoeJue.cn/">
    <meta name="keywords" content="MoeKoe,萌音,kugou,第三方播放器,阿珏酱">
    <link href="/assets/font-awesome/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        // 早期设置 <html lang>，避免首屏语言闪烁。
        // 注意：内联脚本无法访问 src/utils/i18n.js 的模块作用域，支持列表必须在此显式声明
        //（此前直接引用 messages 会抛 ReferenceError，阻断 lang 设置）。
        (() => {
            const SUPPORTED_LOCALES = ['en', 'ja', 'ko', 'ru', 'zh-CN', 'zh-TW'];
            const getBrowserLocale = () => {
                const browserLang = navigator.language || 'en';
                if (browserLang.startsWith('zh')) {
                    if (browserLang === 'zh-TW' || browserLang === 'zh-HK') {
                        return 'zh-TW';
                    }
                    return 'zh-CN';
                }
                const lang = browserLang.split('-')[0];
                return SUPPORTED_LOCALES.includes(lang) ? lang : 'ja';
            };
            let settings = null;
            try {
                settings = JSON.parse(localStorage.getItem('settings'));
            } catch {
                // 配置损坏时退回浏览器语言，早期脚本绝不能抛错
            }
            document.documentElement.lang = settings?.language || getBrowserLocale();
        })();
    </script>
</body>

</html>
